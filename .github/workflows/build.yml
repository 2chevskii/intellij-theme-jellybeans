name: Validate and build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Validate theme resources
        run: |
          python3 -m unittest discover -s scripts
          python3 scripts/validate_theme.py
      - name: Build and verify plugin
        run: ./gradlew buildPlugin verifyPluginStructure verifyPlugin --stacktrace
      - name: Inspect release archive
        run: python3 scripts/validate_theme.py build/distributions/jellybeans-*.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: jellybeans-release
          path: build/distributions/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: verification-reports
          path: build/reports/
