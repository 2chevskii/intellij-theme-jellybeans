import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType

plugins {
    id 'org.jetbrains.intellij.platform' version '2.18.1'
}

group = 'com.boppy'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdea '2023.3'
        pluginVerifier()
    }
}

intellijPlatform {
    buildSearchableOptions = false

    pluginConfiguration {
        ideaVersion {
            sinceBuild = '233'
            untilBuild = provider { null }
        }
    }

    pluginVerification {
        ides {
            latest {
                it.types = [IntelliJPlatformType.IntellijIdea]
            }
        }
    }

    publishing {
        token = providers.systemProperty('jetbrains.token')
    }
}

tasks.wrapper {
    gradleVersion = '9.5.1'
    distributionType = Wrapper.DistributionType.BIN
}
